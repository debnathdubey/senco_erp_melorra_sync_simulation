services:
  - type: web
    name: senco-erp-melorra-sync-simulation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /MelorraIntegration/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: X_API_KEY
        sync: false
